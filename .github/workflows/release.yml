name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: pkg-tui-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            asset: pkg-tui-x86_64-unknown-linux-gnu
          - os: macos-latest
            asset: pkg-tui-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Rename for release
        shell: bash
        run: |
          mkdir -p dist/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/pkg-tui.exe "dist/release/${{ matrix.asset }}"
          else
            cp dist/pkg-tui "dist/release/${{ matrix.asset }}"
          fi
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # npm OIDC Trusted Publisher 按包配置匹配 environment，必须显式声明
    environment: NPM_TOKEN
    # OIDC 免 token 发布必需的 id-token 权限
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # OIDC trusted publishing 需要 npm >= 11.5.1（Node 22 自带的 npm 10 不支持，
      # 会找不到 token 直接失败）；Node 24 + 显式升级 npm 保证版本达标
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11
          NPM_V="$(npm --version)"
          echo "npm $NPM_V on node $(node --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`::error::npm ${process.argv[1]} is below 11.5.1, required for OIDC trusted publishing`);
              process.exit(1);
            }
          ' "$NPM_V"
      - name: Verify version matches tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json version: $VERSION, tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
      - name: Publish to npm (OIDC trusted publishing)
        shell: bash
        run: |
          npm publish --registry=https://registry.npmjs.org --access=public
